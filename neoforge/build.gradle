plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${neoforge_version}"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:${architectury_api_version}"

    // Create Mod
    modImplementation("com.simibubi.create:create-${minecraft_version}:${create_neoforge_version}:slim") { transitive false }
    modImplementation("net.createmod.ponder:ponder-neoforge:${ponder_neoforge_version}+mc${minecraft_version}")
    modCompileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_neoforge_version}")
    modImplementation("com.tterrag.registrate:Registrate:${registrate_neoforge_version}")

    // Create Power grid
    modImplementation "maven.modrinth:power-grid:${powergrid_neoforge_version}"
    
    modLocalRuntime("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_neoforge_version}")

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    def resourceTokens = [
        version: project.version,
        neoforge_version: project.neoforge_version,
        neoforge_version_range: project.neoforge_version_range,
        minecraft_version: project.minecraft_version,
        architectury_api_version: project.architectury_api_version,
        create_neoforge_version: project.create_neoforge_version,
        create_neoforge_range: project.create_neoforge_range,
        powergrid_version: project.powergrid_version,
        powergrid_version_range_neoforge: project.powergrid_version_range_neoforge
    ]
    inputs.properties(resourceTokens)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand resourceTokens
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
