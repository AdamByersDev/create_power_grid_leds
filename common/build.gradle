architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Compile against Power Grid types from common code.
    compileOnly "maven.modrinth:power-grid:${rootProject.powergrid_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${rootProject.minecraft_version}:${rootProject.flywheel_neoforge_version}"
}
